<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/index.js" defer></script>
  </head>
  <body
    class="w-full min-h-dvh px-8 md:px-0 py-12 flex flex-col items-center gap-8 bg-violet-50">
    <nav class="flex items-center gap-4">
      <a
        class="bg-violet-600 text-white px-2 py-1 rounded-lg cursor-default text-sm md:text-base"
        >Lihat Tabel</a
      >
      <span class="font-bold">></span>
      <a href="/index.html" class="text-sm md:text-base">Isi Form</a>
    </nav>
    <div class="w-full md:w-11/12 lg:w-3/4 overflow-x-auto rounded-xl shadow">
      <table class="w-full table-auto border-collapse">
        <thead class="bg-violet-700 text-white">
          <tr>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col"
              rowspan="2">
              Nama
            </th>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col"
              rowspan="2">
              Umur
            </th>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col"
              rowspan="2">
              Jenis Kelamin
            </th>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col"
              rowspan="2">
              Perokok
            </th>
            <th scope="col" colspan="4">Jenis Rokok</th>
          </tr>
          <tr>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col"
              rowspan="2">
              Gudang Garam Filter
            </th>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col"
              rowspan="2">
              Lucky Strike
            </th>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col">
              Marlboro
            </th>
            <th
              class="text-nowrap p-2 border-b-2 border-violet-200"
              scope="col">
              Esse
            </th>
          </tr>
        </thead>
        <tbody class="bg-white"></tbody>
      </table>
    </div>
  </body>
</html>
