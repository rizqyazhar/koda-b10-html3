<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Perokok</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="index.html" class="disabled active">Isi Form</a>
      <span>></span>
      <a href="table.html">Lihat Tabel</a>
    </nav>
    <div class="container">
      <main>
        <header>
          <div>
            <h1>Survey Rokok Favorit</h1>
            <p>Terima kasih atas ketersediaan anda untuk mengisi survey</p>
          </div>
          <div>
            <div>
              <p>johndoe@gmail.com</p>
              <p>Switch Account</p>
            </div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-cloud-check preview-icon">
              <path d="m17 15-5.5 5.5L9 18" />
              <path
                d="M5.516 16.07A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 3.501 7.327" />
            </svg>
          </div>
          <div>
            <p>* Harus diisi!</p>
          </div>
        </header>
        <form action="table.html">
          <div class="input-nama-box">
            <label for="nama">Siapa nama anda? <span>*</span></label>
            <input
              type="text"
              name="nama"
              id="nama"
              class="input-nama"
              placeholder="Jawaban Anda"
              required />
          </div>
          <div class="input-umur-box">
            <label for="umur">Berapa umur anda? <span>*</span></label>
            <input
              type="number"
              name="umur"
              id="umur"
              class="input-umur"
              placeholder="Jawaban Anda"
              required />
          </div>
          <div class="input-gender-box">
            <label for="gender-man"
              >Apa jenis kelamin anda? <span>*</span></label
            >
            <div>
              <div>
                <input type="radio" name="gender" id="gender-man" value="man" />
                <label for="gender-man">Laki-laki</label>
              </div>
              <div>
                <input
                  type="radio"
                  name="gender"
                  id="gender-woman"
                  value="woman"
                  checked />
                <label for="gender-woman">Perempuan</label>
              </div>
            </div>
          </div>
          <div class="input-perokok-box">
            <label for="no">Apakah anda perokok? <span>*</span></label>
            <div>
              <div>
                <input type="radio" name="yes-or-no" id="yes" value="yes" />
                <label for="yes">Ya</label>
              </div>
              <div>
                <input
                  type="radio"
                  name="yes-or-no"
                  id="no"
                  value="no"
                  checked />
                <label for="no">Tidak</label>
              </div>
            </div>
          </div>
          <div class="input-jenisRokok-box">
            <label for="esse"
              >Jika anda perokok, rokok apa yang anda pernah coba?</label
            >
            <div>
              <div>
                <input
                  type="checkbox"
                  name="gudang-garam-filter"
                  id="gudang-garam-filter"
                  value="gudang garam filter"
                  class="jenisrokok-input" />
                <label for="gudang-garam-filter">Gudang Garam Filter</label>
              </div>
              <div>
                <input
                  type="checkbox"
                  name="lucky-strike"
                  id="lucky-strike"
                  value="lucky strike"
                  class="jenisrokok-input" />
                <label for="lucky-strike">Lucky Strike</label>
              </div>
              <div>
                <input
                  type="checkbox"
                  name="marlboro"
                  id="marlboro"
                  value="marlboro"
                  class="jenisrokok-input" />
                <label for="marlboro">Marlboro</label>
              </div>
              <div>
                <input
                  type="checkbox"
                  name="esse"
                  id="esse"
                  value="esse"
                  class="jenisrokok-input" />
                <label for="esse">Esse</label>
              </div>
            </div>
          </div>
          <div class="button-box">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
